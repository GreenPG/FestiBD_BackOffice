<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="description" content="..." />
    <link rel="stylesheet" href="../CSS/style.css">
    <script src="../JS/login.js" defer></script>
    <title>FestiBD Access</title>

</head>

<body>
    <aside>
        <img src="../img/3.png" width="200" height="200" class="my-logo">
    </aside>
    <main>
        <h1>Login As Admin User</h1>
        <form class="login-form" id="login-form">
            <section class="my-section">
                <img src="../img/envelope.fill.svg" width="20" height="16" class="img-form">
                <input type="email" id="email-form" placeholder="E-mail" required>
            </section>
            <p id="message-email"></p>
            <section class="my-section">
                <img src="../img/lock.fill.svg" width="20" height="23" class="img-form">
                <input type="password" id="password-form" placeholder="Password" minlength="8" required>
                <img src="../img/eye.fill.svg" width="20" height="16">
            </section>

            <section class="my-options">
                <p class="p1"><input type="checkbox" id="remember-me">Remember me</p>
                <p class="p1">Forgot password ?</p>
            </section>
            <div class="button-container">
                <input type="submit" id="login-btn" value="Login">
           </div>
            

        </form>
        <p class="msg-password" id="message-password"></p>
    </main>

    <footer>

    </footer>
</body>



</html>
