<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FestiBD Admin</title>
    <link href="../CSS/reset.css" rel="stylesheet" />
    <link href="../CSS/dashboard.css" rel="stylesheet" />
    <link
      rel="shortcut icon"
      type="image/x-icon"
      href="../assets/logo-256x256.ico"
    />
    <script src="../JS/dashboard.js" type="module" defer></script>
  </head>
  <body>
    <header>
      <section class="upper-header">
        <img src="../assets/logo-256x256.ico" alt="FestiBD logo" />
        <section class="log-out">
          <label for="log-out-button">Log out</label>
          <img
            src="../assets/rectangle.portrait.and.arrow.forward.svg"
            alt="Log Out Button"
          />
        </section>
      </section>
      <section class="lower-header"><h1>Workshops</h1></section>
    </header>
    <main>
      <section class="ws-container-header">
        <section class="day-selection">
          <button class="day-nav-button" type="button">
            <img src="../assets/chevron.left.svg" alt="Previous day button" />
          </button>
          <section class="days">
            <p>Fri 13/09</p>
            <p>Sat 14/09</p>
            <p class="selected">Sun 15/09</p>
          </section>
          <button class="day-nav-button" type="button">
            <img src="../assets/chevron.right.svg" alt="Next day button" />
          </button>
        </section>
        <a href="workshop_creation.html" class="new-ws-button">
          <div class="plus-container">
            <img
              class="plus-orange"
              src="../assets/plus-orange.svg"
              alt="Plus icon"
            />
            <img class="plus-black" src="../assets/plus.svg" alt="Plus icon" />
          </div>
          <p>New Workshop</p>
        </a>
      </section>
      <section class="table-container">
        <table>
          <thead>
            <th scope="col">Name</th>
            <th scope="col">Status</th>
            <th scope="col">Category</th>
            <th scope="col">Start</th>
            <th scope="col">End</th>
            <th scope="col">Capacity</th>
            <th scope="col">Bookings</th>
          </thead>
          <tbody></tbody>
        </table>
      </section>
    </main>
  </body>
</html>
